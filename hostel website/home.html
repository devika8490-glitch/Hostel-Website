<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DreamStay Hostel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: url('https://images.unsplash.com/photo-1522708323590-d24dbb6b0267') no-repeat center center fixed;
      background-size: cover;
      color: white;
    }

    header {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 20px 0;
      text-align: center;
    }

    header h1 {
      font-size: 2.5em;
      color: #fff;
      letter-spacing: 2px;
    }

    nav {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 15px;
      font-size: 1.1em;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #00d9ff;
    }

    .hero {
      height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      text-align: center;
      padding: 0 20px;
    }

    .hero h2 {
      font-size: 3em;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 1.2em;
      max-width: 600px;
      margin: 0 auto;
    }

    .section {
      background: rgba(255, 255, 255, 0.1);
      margin: 30px auto;
      padding: 20px;
      max-width: 900px;
      border-radius: 15px;
      backdrop-filter: blur(5px);
    }

    .section h3 {
      color: #00d9ff;
      margin-bottom: 10px;
    }

    .section p {
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 15px;
      background-color: rgba(0, 0, 0, 0.6);
      font-size: 0.9em;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>DreamStay Hostel</h1>
  </header>

  <nav>
    <a href="home.html">Home</a>
    <a href="about.html">About us</a>
    <a href="facilities.html">Facilities</a>
    <a href="booking.html">Booking</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
  </nav>



  <div class="hero">
    <div>
      <h2>Welcome to Your Home Away From Home</h2>
      <p>Affordable, comfortable, and stylish accommodation for travelers, students, and explorers. Stay with us and make unforgettable memories.</p>
    </div>
  </div>

      <footer>
    &copy; 2025 DreamStay Hostel. All rights reserved.
  </footer>

</body>
</html>
